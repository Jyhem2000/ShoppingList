<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0e" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Liste de courses triée par rayon, dans l'ordre de ton magasin."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <script>
      // Thème posé avant l'affichage (pas de flash) ; src/app/theme.ts prend le relais.
      try {
        var t = JSON.parse(
          localStorage.getItem("shoppinglist.preferences") || "{}",
        ).theme;
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var light = t === "light" || (t !== "dark" && !dark);
        document.documentElement.dataset.theme = light ? "light" : "dark";
        // iPhone : texte de la barre d'état en noir sur le thème clair (lu au lancement).
        if (light)
          document
            .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
            .setAttribute("content", "default");
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>%APP_NAME%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
