# Publication d'une version figée en production (docs/07 § 9 — Cycle des versions).
# Déclenchée par un tag vX.Y.Z créé avec `npm version` puis `git push --follow-tags`.
name: Publication

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à (re)publier en production, ex. v0.9.0"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Vérifier et publier en production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_CHANNEL: production
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Le tag correspond à package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Le tag $TAG ne correspond pas à la version $expected de package.json"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e

      - name: Publier sur Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ vars.CF_PAGES_PROJECT }}
            --branch=production
            --commit-hash=${{ github.sha }}

      - name: Notes de version depuis CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Version $version" > release-notes.md

      - name: Créer la Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "ShoppingList ${TAG#v}" --notes-file release-notes.md
