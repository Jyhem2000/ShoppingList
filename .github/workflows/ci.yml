# Intégration continue + déploiements Cloudflare Pages (docs/07 § 9)
#  - pull request → aperçu  : <branche>.<projet>.pages.dev
#  - push sur main → préproduction : main.<projet>.pages.dev
# Rien n'est déployé si une vérification échoue. Sans configuration Cloudflare,
# les vérifications tournent et le déploiement est simplement ignoré.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Vérifications
    runs-on: ubuntu-latest
    env:
      APP_CHANNEL: ${{ github.event_name == 'pull_request' && 'preview' || 'preprod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Navigateurs Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Tests de bout en bout (build inclus)
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  deploy:
    name: Déploiement Cloudflare
    needs: checks
    runs-on: ubuntu-latest
    # Les pull requests venant d'un fork n'ont pas accès aux secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Configuration Cloudflare présente ?
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CF_PAGES_PROJECT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare n'est pas encore configuré : déploiement ignoré."
          fi

      - uses: actions/download-artifact@v4
        if: steps.cf.outputs.enabled == 'true'
        with:
          name: dist
          path: dist

      - name: Publier sur Cloudflare Pages
        if: steps.cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ vars.CF_PAGES_PROJECT }}
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}
